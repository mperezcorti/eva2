<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Sitio Web</title>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-light fs-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html"><img src="img/logo.jpg" width="60%" alt=""></a>
                <div class="navbar" id="navbarNav">
                    <ul class="nav">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="carrito.html">Mi Carrito</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="registro.html">Registrarse</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="fondo-verde" style="background-color: #C5E0C6;">
            <div class="container">
                <div class="row">
                    <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12 text-center text-dark">
                        <h1>Datos Personales</h1>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12 text-center text-dark">
                        <p>Ingrese sus datos para poder procesar su pedido</p>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="correo" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="correo" placeholder="correo@gmail.com">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" placeholder="+56 9 1234 5678">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena" placeholder="Contraseña con mayúscula y número">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="confirmarContraseña" class="form-label">Copia Contraseña</label>
                        <input type="password" class="form-control" id="confirmarContrasena" placeholder="Copie la contraseña anterior">
                    </div>
                </div>
                <button class="btn btn-danger" onclick="registrar();">
                    Registrarse
                </button>

                <div id="datosUsuario" class="mt-4"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container-fluid bg-dark text-center">
            <div class="row p-2">
                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12 text-center text-light">
                    <h4>Ubicación</h4>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12 text-center text-light">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3330.255181224077!2d-70.5943489!3d-33.416590899999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9662cf159f259239%3A0xab6658bdaa55cab0!2sFix%20Cafe!5e0!3m2!1ses!2scl!4v1780357107728!5m2!1ses!2scl" width="450" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12 text-center text-light">Av. Apoquindo 3411, Las Condes, Región Metropolitana. Local 4</div>
                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12 text-center text-light">+56 2 2244 8151</div>
            </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
